<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Menu - Life of Chai</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f5f2;
    }

    .header {
      background: black;
      color: white;
      padding: 15px;
      font-size: 20px;
      z-index: 1000;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      background: red;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #6f1d1d;
    }

    /* Image Styling */
    .menu-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      transition: 0.3s;
    }

    .menu-img:hover {
      transform: scale(1.05);
    }

    .contact-section {
      background: #000;
      color: white;
    }

    footer {
      background: #000;
      color: white;
    }

    /* Responsive Fix */
    @media (max-width: 768px) {
      .header {
        font-size: 16px;
        padding: 10px;
      }

      .menu-img {
        height: 200px;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="header d-flex justify-content-between align-items-center px-3 fixed-top">
  <a href="../project2/index.html" class="back-btn">⬅ Back</a>
  <div>Life Of Chai ☕</div>
  <div></div>
</div>

<!-- MENU SECTION -->
<section class="container pt-5 mt-5">
  <h2 class="text-center mb-4">Our Menu ☕</h2>

  <div class="row g-4">
    <div class="col-lg-4 col-md-6 col-12">
      <img src="../project2/images/menu.jpeg" class="menu-img">
    </div>

    <div class="col-lg-4 col-md-6 col-12">
      <img src="../project2/images/kulhad.jpg" class="menu-img">
    </div>

    <div class="col-lg-4 col-md-6 col-12">
      <img src="../project2/images/lemon tea.jpeg" class="menu-img">
    </div>
  </div>
</section>

<!-- CONTACT -->
<section class="contact-section text-center py-5 mt-5">
  <h3>Contact Us</h3>
  <p>📞 9130865142</p>
</section>

<!-- FOOTER -->
<footer class="text-center py-3">
  <p>© 2025 Life of Chai | Designed By Komal Ganeshe 😄</p>
</footer>

</body>
</html>
